# Single HTTP entry point for the local Supabase stand-in.
# /auth/v1/* -> GoTrue, /rest/v1/* -> PostgREST, matching the hosted URL layout
# that supabase-js expects.
server {
  listen 80;
  server_name _;
  client_max_body_size 20m;

  # The app is served from a different host port, so every call is cross-origin.
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, accept, accept-profile, content-profile, prefer, range, x-upsert" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-range, content-profile, preference-applied, location" always;
  add_header Access-Control-Max-Age "86400" always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  location = /health {
    return 200 "ok\n";
  }

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
  }

  location / {
    return 404;
  }
}
